name: Public source gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: public-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-validation:
    name: Windows source validation
    # Keep a stable Windows PowerShell 5.1/OpenSSH baseline for source CI.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: "11.8.0"
      - name: Install locked dependencies
        run: |
          uv --directory apps/api sync --frozen
          pnpm install --frozen-lockfile
      - name: Validate contracts and SBOM
        run: |
          uv --directory apps/api run python ../../ops/windows/v8a/validate_contracts.py
          uv --directory apps/api run python ../../ops/release/generate_v8f_artifacts.py --check
      - name: Parse Windows entry points
        shell: powershell
        run: |
          Get-ChildItem ops/windows/v8a/*.ps1,ops/windows/v8a/*.psm1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName))
          }
      - name: Validate Windows supervisor and installer contracts
        # These tests intentionally launch Windows PowerShell 5.1 release
        # scripts. Run the parent step in Windows PowerShell as well so child
        # processes inherit its compatible built-in module path; pwsh's module
        # path can shadow Get-FileHash/Get-Acl with PowerShell 7 modules.
        shell: powershell
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv --directory apps/api run python -m pytest `
            ../../apps/supervisor/tests -m "not integration" -p no:cacheprovider
      - name: Full repository validation
        run: pnpm validate

  open-source-policy:
    name: Open-source policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse CI-held release signing keys
        shell: bash
        run: |
          test -z "${{ secrets.LOCAL_RAG_RELEASE_PRIVATE_KEY }}"
          test -f LICENSE
          test -f README
          test -f SECURITY
          test -f CODE_OF_CONDUCT
          test -f CONTRIBUTING
          test -f THIRD_PARTY_NOTICES
          test -f MODEL_LICENSES
          test -f SBOM.cdx.json
      - name: Explain publish boundary
        run: |
          echo "CI validates the open-source tree. The optional Personal bundle uses offline signing and owner-run clean-machine acceptance."

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject newly introduced high-severity vulnerabilities
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
